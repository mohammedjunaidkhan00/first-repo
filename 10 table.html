<!DOCTYPE html>
<html>
<body>

<input id="search" placeholder="Search">

<table border="1">
    <tr>
        <th onclick="sortTable()">Name</th>
        <th>Age</th>
    </tr>
    <tr><td>John</td><td>25</td></tr>
    <tr><td>Alice</td><td>30</td></tr>
    <tr><td>David</td><td>28</td></tr>
</table>

<script>
function sortTable() {
    let table = document.querySelector("table");
    let rows = Array.from(table.rows).slice(1);

    rows.sort((a,b) =>
        a.cells[0].innerText.localeCompare(b.cells[0].innerText));
    rows.forEach(row => table.appendChild(row));}

document.getElementById("search").onkeyup = function() {
    let text = this.value.toLowerCase();
    for (let row of document.querySelectorAll("table tr")) {
        if (row.cells[0]) {
            row.style.display =
                row.cells[0].innerText.toLowerCase().includes(text)
                ? ""
                : "none";}}};
</script>

</body>
</html>
